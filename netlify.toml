# Pin the runtime so the build does not drift with Netlify's default.
[build.environment]
  NODE_VERSION = "22"

# Holds the demo's Groq proxy. GROQ_API_KEY is read here at request time and
# is never exposed to the browser, so it must be set as a site environment
# variable — not in any .env file the webpack build inlines into the bundle.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `netlify dev` needs to be told how to start this app, otherwise it falls back
# to a static server and serves the repo directory instead of the webpack dev
# server. With this it runs `pnpm dev` on 3002, proxies it on 8888, and serves
# netlify/functions alongside — which is the only way to exercise the demo key
# locally, since a plain `pnpm dev` has no server to hold GROQ_API_KEY.
[dev]
  command = "pnpm dev"
  targetPort = 3002
  port = 8888
  framework = "#custom"
  autoLaunch = false

# Single-page app: every route falls back to index.html. Function paths are
# routed before redirects are applied, so they are unaffected by this.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
